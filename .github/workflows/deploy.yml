name: deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # PR（含 fork）只跑测试；push master / 手动触发才构建部署。
    # 分支保护要求 test-build-deploy check 在 PR 上出现，workflow 缺 pull_request 触发时 PR 永远 blocked。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.id == github.event.repository.id
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        # rust-embed 需要编译期存在的 dist 目录（interpolate $ROVORTEX_ADMIN_DIST）；
        # 测试不需要真实前端产物（真实产物在 Docker web-builder 阶段产出），空目录即可。
        run: |
          mkdir -p web/admin/dist
          export ROVORTEX_ADMIN_DIST="$PWD/web/admin/dist"
          cargo test --workspace

      - name: Set image tag
        id: tag
        if: github.event_name != 'pull_request'
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/gateway_api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rovortex-api:latest
            ghcr.io/${{ github.repository_owner }}/rovortex-api:${{ steps.tag.outputs.sha }}

      - name: Deploy to cloud-01
        if: github.event_name != 'pull_request'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository_owner }}/rovortex-api:${{ steps.tag.outputs.sha }}
            docker tag ghcr.io/${{ github.repository_owner }}/rovortex-api:${{ steps.tag.outputs.sha }} rovortex-rovortex:latest
            cd /srv/rovortex && docker compose up -d --no-build
            docker image prune -f
