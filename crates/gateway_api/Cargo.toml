[package]
name = "rovortex-gateway-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rovortex-users.workspace = true
storage_pg = { path = "../storage_pg" }
infra_mail = { path = "../infra_mail" }

axum.workspace = true
tower-http.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
reqwest.workspace = true
base64.workspace = true
rand_core = { version = "0.6", features = ["getrandom"] }
# admin SPA 嵌入（web/admin 构建产物）；interpolate 让 folder 支持 $ENV_VAR
rust-embed = { version = "8", optional = true, features = ["interpolate-folder-path"] }

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "tls-rustls",
    "uuid",
    "chrono",
    "migrate",
] }

[features]
default = ["admin-web"]
admin-web = ["dep:rust-embed"]
