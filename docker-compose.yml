services:
  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rovortex
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: rovortex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rovortex -d rovortex"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rovortex:
    build:
      context: .
      dockerfile: crates/gateway_api/Dockerfile
    environment:
      ROVORTEX_DB_URL: postgres://rovortex:${DB_PASSWORD}@pg:5432/rovortex
      RUST_LOG: info
    ports:
      - "8080:8080"
    depends_on:
      pg:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
