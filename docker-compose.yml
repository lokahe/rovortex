services:
  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rovortex
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: rovortex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rovortex -d rovortex"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rovortex:
    build:
      context: .
      dockerfile: crates/gateway_api/Dockerfile
    environment:
      ROVORTEX_DB_URL: postgres://rovortex:${DB_PASSWORD}@pg:5432/rovortex
      ROVORTEX_JWT_SECRET: ${ROVORTEX_JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ROVORTEX_MAIL_FROM: ${ROVORTEX_MAIL_FROM:-onboarding@resend.dev}
      ROVORTEX_VERIFY_URL_BASE: ${ROVORTEX_VERIFY_URL_BASE:-http://localhost:8080}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      ROVORTEX_ADMIN_EMAILS: ${ROVORTEX_ADMIN_EMAILS:-}
      ROVORTEX_CORS_ORIGINS: ${ROVORTEX_CORS_ORIGINS:-}
      # 运维参数（可省略，省略时用代码内默认值；见 docs/DEPLOY.md）
      ROVORTEX_LOGIN_MAX_FAILURES: ${ROVORTEX_LOGIN_MAX_FAILURES:-}
      ROVORTEX_LOGIN_LOCK_WINDOW_SECS: ${ROVORTEX_LOGIN_LOCK_WINDOW_SECS:-}
      ROVORTEX_MAIL_MIN_INTERVAL_SECS: ${ROVORTEX_MAIL_MIN_INTERVAL_SECS:-}
      ROVORTEX_MAIL_HOURLY_LIMIT: ${ROVORTEX_MAIL_HOURLY_LIMIT:-}
      ROVORTEX_MAIL_HOURLY_WINDOW_SECS: ${ROVORTEX_MAIL_HOURLY_WINDOW_SECS:-}
      ROVORTEX_LOG_BUFFER_CAPACITY: ${ROVORTEX_LOG_BUFFER_CAPACITY:-}
      ROVORTEX_REFRESH_TTL_DAYS: ${ROVORTEX_REFRESH_TTL_DAYS:-}
      ROVORTEX_EMAIL_VERIFICATION_TTL_MINS: ${ROVORTEX_EMAIL_VERIFICATION_TTL_MINS:-}
      ROVORTEX_DELETION_GRACE_DAYS: ${ROVORTEX_DELETION_GRACE_DAYS:-}
      ROVORTEX_PASSWORD_MIN_LENGTH: ${ROVORTEX_PASSWORD_MIN_LENGTH:-}
      ROVORTEX_PASSWORD_MAX_LENGTH: ${ROVORTEX_PASSWORD_MAX_LENGTH:-}
      RUST_LOG: info
    ports:
      - "8080:8080"
    depends_on:
      pg:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
